name: Windows build

on:
  push:
    branches: ['main', 'claude/**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Type check
        run: npm run typecheck

      - name: Build installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'smoke.json'
          $p = Start-Process -FilePath 'release\win-unpacked\Saxophonia.exe' -ArgumentList "--smoke-test=$report" -PassThru -Wait
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed (exit code $($p.ExitCode))" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Saxophonia-Windows-Setup
          path: release/*.exe
          if-no-files-found: error

      - name: Read app version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # A release is published for v* tags, or when a commit message on a
      # pushed branch contains [publish-release] (the tag is then created by
      # this workflow from the version in package.json).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[publish-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          name: Саксофония v${{ steps.ver.outputs.version }}
          body: |
            ## Саксофония — обучающее приложение для альт-саксофона

            Курс из 12 модулей (57 уроков, 12 экзаменов) от дыхания до импровизации, оценка игры через микрофон, ИИ-наставник Бибоп (OpenRouter), тюнер, метроном, бурдон, аппликатуры, аккомпанемент, импорт MusicXML/MIDI.

            ### Установка (Windows 10/11, 64 бит)
            1. Скачайте файл **Saxophonia-Setup-${{ steps.ver.outputs.version }}.exe** ниже (раздел Assets).
            2. Запустите его. Windows может показать «Система Windows защитила ваш компьютер» — у установщика нет платной цифровой подписи. Нажмите **«Подробнее» → «Выполнить в любом случае»**.
            3. Откройте «Саксофонию» с рабочего стола и пройдите мастер первого запуска.

            Для занятий нужны микрофон и наушники. Подробности — в [руководстве пользователя](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/GUIDE.md).
